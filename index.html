<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Analyzer AI</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Google API & Identity Services -->
    <script async defer src="https://apis.google.com/js/api.js"></script>
    <script async defer src="https://accounts.google.com/gsi/client"></script>
</head>
<body class="bg-gray-900 text-white font-sans antialiased min-h-screen">

    <!-- HALAMAN LOGIN -->
    <div id="login-screen" class="flex flex-col items-center justify-center min-h-screen p-6">
        <div class="bg-gray-800 p-8 rounded-2xl shadow-xl text-center max-w-sm w-full border border-gray-700">
            <h1 class="text-3xl font-bold mb-2 text-red-500">YT Analyzer</h1>
            <p class="text-gray-400 mb-8 text-sm">Masuk untuk menganalisis channel Anda secara real-time.</p>
            <button id="btn-login" disabled class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-xl transition duration-200 disabled:opacity-50 disabled:cursor-not-allowed">
                Memuat Google API...
            </button>
        </div>
    </div>

    <!-- HALAMAN DASHBOARD -->
    <div id="dashboard-screen" class="hidden flex-col min-h-screen p-4 md:p-8 max-w-4xl mx-auto">
        <!-- Header -->
        <header class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-2xl font-bold text-red-500">Dasbor Analitik</h1>
                <p class="text-gray-400 text-sm">Data ditarik langsung dari YouTube Anda</p>
            </div>
            <button id="btn-logout" class="bg-gray-700 hover:bg-gray-600 text-sm py-2 px-4 rounded-lg transition">Keluar</button>
        </header>

        <!-- Kartu Statistik Utama -->
        <div class="grid grid-cols-2 gap-4 mb-8">
            <div class="bg-gray-800 p-6 rounded-2xl border border-gray-700">
                <p class="text-gray-400 text-sm font-medium mb-1">Total Penayangan</p>
                <h2 id="total-views" class="text-3xl font-bold text-white">---</h2>
            </div>
            <div class="bg-gray-800 p-6 rounded-2xl border border-gray-700">
                <p class="text-gray-400 text-sm font-medium mb-1">Total Subscriber</p>
                <h2 id="total-subs" class="text-3xl font-bold text-white">---</h2>
            </div>
        </div>

        <!-- Notifikasi AI Strategi -->
        <div id="ai-strategy-box" class="bg-gray-800 border border-gray-600 p-5 rounded-2xl mb-8 flex items-start gap-4">
            <div class="text-2xl">🤖</div>
            <div>
                <h3 class="font-bold mb-1 text-white">AI Strategi Asisten</h3>
                <p id="ai-strategy-text" class="text-sm text-gray-300">Sedang menganalisis data channel Anda...</p>
            </div>
        </div>

        <!-- Grafik Trafik Penonton -->
        <div class="bg-gray-800 p-4 rounded-2xl border border-gray-700 mb-8 h-72">
            <p class="text-gray-400 text-sm font-medium mb-4 pl-2">Trafik 30 Hari Terakhir</p>
            <div class="relative h-56 w-full">
                <canvas id="trafficChart"></canvas>
            </div>
        </div>
    </div>

    <!-- LOGIKA JAVASCRIPT -->
    <script>
        // === KONFIGURASI GOOGLE API ===
        // PENTING: Ganti dengan Client ID Anda sendiri!
        const CLIENT_ID = '567027122724-sagkacd58auhmv0t6svsffqucgta2vrl.apps.googleusercontent.com'; 
        
        const DISCOVERY_DOCS = [
            'https://www.googleapis.com/discovery/v1/apis/youtube/v3/rest',
            'https://youtubeanalytics.googleapis.com/$discovery/rest?version=v2'
        ];
        // Meminta izin untuk membaca data channel dan analitik
        const SCOPES = 'https://www.googleapis.com/auth/youtube.readonly https://www.googleapis.com/auth/yt-analytics.readonly';

        let tokenClient;
        let gapiInited = false;
        let gisInited = false;
        let trafficChartInstance = null;

                // 1. Muat Google API Client (GAPI)
        gapi.load('client', () => {
            gapi.client.init({
                discoveryDocs: DISCOVERY_DOCS,
            }).then(() => {
                gapiInited = true;
                checkAuthReady();
            }).catch(err => {
                // Tambahan baris ini untuk memunculkan pesan error ke layar!
                alert("Penyebab gagal: " + JSON.stringify(err));
                console.error("GAPI Init Error:", err);
            });
        });

        // 2. Muat Google Identity Services (OAuth 2.0)
        window.onload = function () {
            tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: CLIENT_ID,
                scope: SCOPES,
                callback: (tokenResponse) => {
                    if (tokenResponse && tokenResponse.access_token) {
                        // Jika berhasil login, pindah ke halaman dasbor
                        document.getElementById('login-screen').classList.add('hidden');
                        document.getElementById('dashboard-screen').classList.remove('hidden');
                        document.getElementById('dashboard-screen').classList.add('flex');
                        fetchRealYouTubeData();
                    }
                },
            });
            gisInited = true;
            checkAuthReady();
        };

        // Aktifkan tombol login jika library Google sudah siap
        function checkAuthReady() {
            if (gapiInited && gisInited) {
                const btn = document.getElementById('btn-login');
                btn.disabled = false;
                btn.innerText = 'Login dengan Akun YouTube';
                btn.classList.replace('bg-blue-600', 'bg-red-600');
                btn.classList.replace('hover:bg-blue-700', 'hover:bg-red-700');
            }
        }

        // 3. Trigger Login Saat Tombol Diklik
        document.getElementById('btn-login').addEventListener('click', () => {
            tokenClient.requestAccessToken({prompt: 'consent'});
        });

        // Trigger Logout
        document.getElementById('btn-logout').addEventListener('click', () => {
            const token = gapi.client.getToken();
            if (token !== null) {
                google.accounts.oauth2.revoke(token.access_token, () => {
                    gapi.client.setToken('');
                    location.reload(); // Reload halaman untuk kembali ke menu login
                });
            }
        });

        // 4. Tarik Data Channel & Analytics Asli
        async function fetchRealYouTubeData() {
            try {
                // A. Ambil Data Channel Dasar (Subscriber & Total Views)
                const channelResponse = await gapi.client.youtube.channels.list({
                    part: 'snippet,statistics',
                    mine: true
                });

                const channel = channelResponse.result.items[0];
                const stats = channel.statistics;

                // Tampilkan di UI
                document.getElementById('total-views').innerText = formatNumber(stats.viewCount);
                document.getElementById('total-subs').innerText = formatNumber(stats.subscriberCount);
                
                // B. Ambil Analytics 30 Hari Terakhir
                const endDate = new Date().toISOString().split('T')[0];
                const startDate = new Date(Date.now() - 30 * 24 * 60 * 60 * 1000).toISOString().split('T')[0];
                
                const analyticsResponse = await gapi.client.youtubeAnalytics.reports.query({
                    ids: 'channel==MINE',
                    startDate: startDate,
                    endDate: endDate,
                    metrics: 'views',
                    dimensions: 'day',
                    sort: 'day'
                });

                const reportRows = analyticsResponse.result.rows || [];
                
                // Pisahkan data tanggal dan data views
                const labels = reportRows.map(row => row[0]); // Kolom tanggal
                const viewsData = reportRows.map(row => row[1]); // Kolom views

                renderRealChart(labels, viewsData);
                generateAIStrategy(reportRows);

            } catch (err) {
                console.error("Gagal menarik data API:", err);
                alert("Gagal memuat data. Error: " + (err.result?.error?.message || err.message));
                document.getElementById('ai-strategy-text').innerText = "Gagal menganalisis. Pastikan email Anda sudah ditambahkan sebagai 'Test User' di Google Cloud Console jika aplikasi masih dalam status 'Testing'.";
            }
        }

        // Format angka (misal: 1000000 -> 1.000.000)
        function formatNumber(num) {
            return parseInt(num).toLocaleString('id-ID');
        }

        // 5. Render Grafik dengan Chart.js
        function renderRealChart(labels, data) {
            const ctx = document.getElementById('trafficChart').getContext('2d');
            
            // Hapus chart lama jika sudah ada (mencegah bug chart bertumpuk)
            if (trafficChartInstance) {
                trafficChartInstance.destroy();
            }

            trafficChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Penonton Harian',
                        data: data,
                        borderColor: '#ef4444', // Warna merah YouTube
                        backgroundColor: 'rgba(239, 68, 68, 0.1)',
                        borderWidth: 2,
                        tension: 0.3,
                        fill: true,
                        pointRadius: 3,
                        pointBackgroundColor: '#ef4444'
                    }]
                },
                options: { 
                    responsive: true, 
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        y: { 
                            beginAtZero: true,
                            grid: { color: 'rgba(255,255,255,0.1)' },
                            ticks: { color: '#9ca3af' }
                        },
                        x: { 
                            grid: { display: false },
                            ticks: { 
                                color: '#9ca3af',
                                maxTicksLimit: 7 // Agar label bawah tidak bertumpuk
                            }
                        }
                    }
                }
            });
        }

        // 6. Logika Sederhana AI Evaluator
        function generateAIStrategy(historyRows) {
            const strategyBox = document.getElementById('ai-strategy-box');
            const strategyText = document.getElementById('ai-strategy-text');
            
            if (historyRows.length < 14) {
                strategyText.innerHTML = "Data kurang dari 14 hari. Teruslah mengupload secara konsisten agar AI dapat membandingkan tren mingguan Anda.";
                return;
            }

            // Hitung views 7 hari pertama vs 7 hari terakhir dari data yang didapat
            const last7Days = historyRows.slice(-7).reduce((sum, row) => sum + row[1], 0);
            const previous7Days = historyRows.slice(-14, -7).reduce((sum, row) => sum + row[1], 0);
            
            if (last7Days < previous7Days) {
                // Skenario: Trafik Menurun
                strategyText.innerHTML = `<span class="text-red-400 font-bold">Performa Kurang.</span> Trafik 7 hari terakhir (${formatNumber(last7Days)} views) lebih rendah dibanding minggu sebelumnya (${formatNumber(previous7Days)} views). <strong>Strategi:</strong> AI menyarankan untuk mengevaluasi *thumbnail* video terbaru Anda atau membuat video yang menjawab kolom komentar terbaru untuk memancing *engagement*.`;
                strategyBox.className = 'bg-red-900 border border-red-500 p-5 rounded-2xl mb-8 flex items-start gap-4';
            } else if (last7Days > previous7Days * 1.5) {
                // Skenario: Trafik Sangat Bagus (naik 50%+)
                strategyText.innerHTML = `<span class="text-green-400 font-bold">Performa Sangat Bagus!</span> Trafik Anda meroket ke ${formatNumber(last7Days)} views minggu ini! <strong>Strategi:</strong> Ini adalah peluang monetisasi! Segera buat "Part 2" dari video terpopuler minggu ini atau sematkan komentar promo afiliasi di video tersebut.`;
                strategyBox.className = 'bg-green-900 border border-green-500 p-5 rounded-2xl mb-8 flex items-start gap-4';
            } else {
                // Skenario: Trafik Stabil/Bagus (naik sedikit)
                strategyText.innerHTML = `<span class="text-blue-400 font-bold">Performa Bagus.</span> Trafik stabil dan menunjukkan tren positif (${formatNumber(last7Days)} views minggu ini). <strong>Strategi:</strong> Pertahankan frekuensi upload Anda. Coba gunakan fitur YouTube Community (polling/gambar) untuk menjaga penonton tetap hangat sebelum unggahan video berikutnya.`;
                strategyBox.className = 'bg-blue-900 border border-blue-500 p-5 rounded-2xl mb-8 flex items-start gap-4';
            }
        }
    </script>
</body>
</html>
